name: Build HouseGuide VST3
on:
  workflow_dispatch:
  push:
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: HouseGuide-VST3
          path: build/HouseGuide_artefacts/Release/VST3/
